<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EdgeGuard AI — Secure Access</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg: #0a0e17;
    --panel: #111827;
    --panel-border: #1f2937;
    --text: #e5e9f0;
    --text-dim: #7b8494;
    --blue: #3b82f6;
    --cyan: #38bdf8;
    --red: #f43f5e;
    --green: #22c55e;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: radial-gradient(circle at 20% 10%, #10192e 0%, var(--bg) 55%);
    color: var(--text);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    overflow:hidden;
    position:relative;
  }

  /* ---------- Ambient grid + glow background ---------- */
  .grid-bg{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(59,130,246,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.06) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image: radial-gradient(circle at 50% 40%, #000 10%, transparent 70%);
    animation: drift 30s linear infinite;
  }
  @keyframes drift{ from{ background-position:0 0,0 0; } to{ background-position:420px 0,0 420px; } }

  .glow-orb{
    position:absolute; width:520px; height:520px; border-radius:50%;
    background: radial-gradient(circle, rgba(59,130,246,0.22), transparent 70%);
    top:-160px; left:-120px;
    animation: float1 9s ease-in-out infinite;
    filter: blur(10px);
  }
  .glow-orb.red{
    background: radial-gradient(circle, rgba(244,63,94,0.16), transparent 70%);
    top:auto; bottom:-180px; right:-140px; left:auto;
    animation: float2 11s ease-in-out infinite;
  }
  @keyframes float1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(30px,20px); } }
  @keyframes float2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-25px,-15px); } }

  /* ---------- Card ---------- */
  .auth-card{
    position:relative;
    width:380px;
    background: rgba(17,24,39,0.85);
    backdrop-filter: blur(14px);
    border:1px solid var(--panel-border);
    border-radius:16px;
    padding:34px 32px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: cardIn .5s ease;
  }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(14px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }

  .brand{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:26px; }
  .brand-icon{
    width:50px; height:50px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    border-radius:12px;
    box-shadow: 0 0 24px rgba(59,130,246,0.55);
    animation: iconPulse 3s ease-in-out infinite;
  }
  @keyframes iconPulse{ 0%,100%{ box-shadow:0 0 18px rgba(59,130,246,0.45); } 50%{ box-shadow:0 0 30px rgba(59,130,246,0.75); } }
  .brand-icon svg{ width:26px; height:26px; fill:#fff; }
  .brand-name{ font-size:19px; font-weight:700; letter-spacing:.3px; }
  .brand-sub{ font-size:12px; color:var(--text-dim); }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; background: rgba(255,255,255,0.03);
    border:1px solid var(--panel-border); border-radius:10px;
    padding:4px; margin-bottom:24px; position:relative;
  }
  .tab-slider{
    position:absolute; top:4px; bottom:4px; left:4px;
    width:calc(50% - 4px);
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    border-radius:7px;
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 2px 10px rgba(59,130,246,0.4);
  }
  .tabs.register .tab-slider{ transform: translateX(100%); }
  .tab-btn{
    flex:1; position:relative; z-index:1;
    background:none; border:none; padding:9px 0;
    font-size:13px; font-weight:600; color:var(--text-dim);
    cursor:pointer; transition: color .25s ease;
  }
  .tab-btn.active{ color:#fff; }

  /* ---------- Forms ---------- */
  .form-stack{ position:relative; }
  form{
    display:flex; flex-direction:column; gap:16px;
  }
  form.hidden{ display:none; }

  .field{ position:relative; }
  .field label{
    display:block; font-size:11px; color:var(--text-dim);
    margin-bottom:6px; letter-spacing:.3px;
  }
  .field input{
    width:100%; background: rgba(255,255,255,0.03);
    border:1px solid var(--panel-border);
    border-radius:8px; padding:11px 12px 11px 38px;
    color:var(--text); font-size:14px;
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .field input:focus{
    outline:none; border-color:var(--cyan);
    box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
    background: rgba(56,189,248,0.04);
  }
  .field svg{
    position:absolute; left:12px; top:34px;
    width:15px; height:15px; fill:var(--text-dim);
    transition: fill .2s ease;
  }
  .field input:focus + svg,
  .field input:focus ~ svg{ fill: var(--cyan); }

  .submit-btn{
    margin-top:6px;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    border:none; border-radius:9px;
    color:#fff; font-size:14px; font-weight:600;
    padding:12px 0; cursor:pointer;
    position:relative; overflow:hidden;
    transition: transform .15s ease, box-shadow .2s ease;
    box-shadow: 0 6px 20px rgba(59,130,246,0.35);
  }
  .submit-btn:hover{ transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59,130,246,0.5); }
  .submit-btn:active{ transform: translateY(0); }
  .submit-btn:disabled{ opacity:.7; cursor:not-allowed; }

  .spinner{
    width:15px; height:15px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    display:inline-block; vertical-align:middle; margin-right:8px;
    animation: spin .7s linear infinite;
    display:none;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .submit-btn.loading .spinner{ display:inline-block; }
  .submit-btn.loading .btn-text{ opacity:.85; }

  .msg{
    font-size:12.5px; border-radius:8px; padding:9px 12px;
    display:none; align-items:center; gap:8px;
    animation: msgIn .25s ease;
  }
  @keyframes msgIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
  .msg.show{ display:flex; }
  .msg.error{ background: rgba(244,63,94,0.1); color: var(--red); border:1px solid rgba(244,63,94,0.3); }
  .msg.success{ background: rgba(34,197,94,0.1); color: var(--green); border:1px solid rgba(34,197,94,0.3); }

  .switch-hint{
    text-align:center; font-size:12.5px; color:var(--text-dim); margin-top:20px;
  }
  .switch-hint a{ color:var(--cyan); text-decoration:none; font-weight:600; cursor:pointer; }
  .switch-hint a:hover{ text-decoration:underline; }
</style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="glow-orb"></div>
  <div class="glow-orb red"></div>

  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2 3 6v6c0 5.25 3.75 9.75 9 11 5.25-1.25 9-5.75 9-11V6l-9-4Zm0 2.2 7 3.1V12c0 4.2-2.9 7.9-7 8.94C7.9 19.9 5 16.2 5 12V7.3l7-3.1Zm-1 5.3v6l5-3-5-3Z"/></svg>
      </div>
      <div class="brand-name">EdgeGuard AI</div>
      <div class="brand-sub">Network Security Console</div>
    </div>

    <div class="tabs" id="tabs">
      <div class="tab-slider"></div>
      <button class="tab-btn active" id="tabLogin" type="button">Login</button>
      <button class="tab-btn" id="tabRegister" type="button">Register</button>
    </div>

    <div class="form-stack">
      <!-- ---------------- LOGIN ---------------- -->
      <form id="loginForm">
        <div class="msg error" id="loginError"></div>
        <div class="msg success" id="loginSuccess"></div>

        <div class="field">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" autocomplete="username" required>
          <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-9 2.2-9 5v3h18v-3c0-2.8-4.6-5-9-5Z"/></svg>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" autocomplete="current-password" required>
          <svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 0 0-4 4v3H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a4 4 0 0 0-4-4Zm0 2a2 2 0 0 1 2 2v3H10V6a2 2 0 0 1 2-2Z"/></svg>
        </div>

        <button type="submit" class="submit-btn" id="loginBtn">
          <span class="spinner"></span><span class="btn-text">Sign In</span>
        </button>
      </form>

      <!-- ---------------- REGISTER ---------------- -->
      <form id="registerForm" class="hidden">
        <div class="msg error" id="registerError"></div>
        <div class="msg success" id="registerSuccess"></div>

        <div class="field">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" autocomplete="username" required>
          <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-9 2.2-9 5v3h18v-3c0-2.8-4.6-5-9-5Z"/></svg>
        </div>
        <div class="field">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" autocomplete="new-password" required minlength="6">
          <svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 0 0-4 4v3H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a4 4 0 0 0-4-4Zm0 2a2 2 0 0 1 2 2v3H10V6a2 2 0 0 1 2-2Z"/></svg>
        </div>
        <div class="field">
          <label for="regConfirm">Confirm Password</label>
          <input type="password" id="regConfirm" autocomplete="new-password" required minlength="6">
          <svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2Z"/></svg>
        </div>

        <button type="submit" class="submit-btn" id="registerBtn">
          <span class="spinner"></span><span class="btn-text">Create Account</span>
        </button>
      </form>
    </div>

    <div class="switch-hint" id="loginHint">
      New here? <a id="goRegister">Create an account</a>
    </div>
  </div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
